name: CARTO Upstream Sync - Ready Checker

# Watches CI workflow completions and adds "sync-ready" label when PR is fully ready
# This label then triggers the n8n notifier workflow
# Posts Step 4 "Tests Passed" notification when PR is ready for merge

on:
  workflow_run:
    # Only workflows that actually run against carto/main PRs. "LiteLLM Mock
    # Tests" is upstream-deprecated (workflow_dispatch only) and "LiteLLM
    # Linting" only triggers for upstream's own branches, never carto/main -
    # both were removed. "CARTO Feature Tests" is CARTO's own unit-test gate
    # (carto-feature-tests.yml); it must be listed here so sync-ready waits for
    # the tests, not just the Docker build. workflow_run only re-invokes this
    # workflow when a LISTED workflow completes, so an unlisted test gate that
    # finishes after the Docker build would never get sync-ready applied.
    # Must equal .github/carto-sync-required-workflows.yml (enforced by check_sync_workflow_triggers.py).
    workflows:
      - "CARTO - Deploy Docker Image (CI)"
      - "CARTO Feature Tests"
      - "CARTO Features Manifest Check"
      - "CARTO Upstream Preserved Check"
    types:
      - completed
    branches:
      - 'upstream-sync/**'

permissions:
  contents: read
  pull-requests: write  # Need write to add labels

env:
  SLACK_CHANNEL_LITELLM: "C0A11FKJHDK"  # litellm-fork changelog
  DOCS_URL: "https://cartodb.getoutline.com/doc/ci-litellm-fork-pMyvwMTU3l"

jobs:
  check-and-label:
    name: Check if PR is ready
    runs-on: ubuntu-latest
    # Only run on successful CI completions
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      # workflow_run executes from the default branch, so the required list cannot be altered by the sync PR
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          sparse-checkout: .github/carto-sync-required-workflows.yml
          sparse-checkout-cone-mode: false

      - name: Check PR readiness and add label
        id: check-and-label
        env:
          GH_TOKEN: ${{ secrets.X_GITHUB_SUPERCARTOFANTE }}
        run: |
          set -eu

          BRANCH="${{ github.event.workflow_run.head_branch }}"
          echo "::group::Checking if PR from ${BRANCH} is ready for sync-ready label"

          # Find PR for this branch
          PR_JSON=$(gh pr list \
            --repo ${{ github.repository }} \
            --head "${BRANCH}" \
            --base "carto/main" \
            --json number,mergeable,labels,url,title \
            --jq '.[0]')

          if [[ -z "${PR_JSON}" || "${PR_JSON}" == "null" ]]; then
            echo "[Ready Checker] No PR found for branch ${BRANCH}"
            echo "::endgroup::"
            exit 0
          fi

          PR_NUMBER=$(echo "${PR_JSON}" | jq -r '.number')
          MERGEABLE=$(echo "${PR_JSON}" | jq -r '.mergeable')
          PR_URL=$(echo "${PR_JSON}" | jq -r '.url')
          PR_TITLE=$(echo "${PR_JSON}" | jq -r '.title')
          LABELS=$(echo "${PR_JSON}" | jq -r '.labels[].name' | tr '\n' ',' | sed 's/,$//')
          # Use jq for exact label matching (avoid substring matches)
          HAS_UPSTREAM_SYNC=$(echo "${PR_JSON}" | jq '[.labels[].name] | any(. == "upstream-sync")')
          HAS_SYNC_READY=$(echo "${PR_JSON}" | jq '[.labels[].name] | any(. == "sync-ready")')
          HAS_SILENT_SYNC=$(echo "${PR_JSON}" | jq '[.labels[].name] | any(. == "silent-sync")')

          echo "[Ready Checker] PR #${PR_NUMBER}: ${PR_TITLE}"
          echo "[Ready Checker] Mergeable: ${MERGEABLE}"
          echo "[Ready Checker] Labels: ${LABELS}"

          # Check 1: Must have upstream-sync label
          if [[ "${HAS_UPSTREAM_SYNC}" != "true" ]]; then
            echo "[Ready Checker] ❌ Missing upstream-sync label - not an upstream sync PR"
            echo "::endgroup::"
            exit 0
          fi

          # Check 2: Must NOT already have sync-ready label (avoid duplicate work)
          if [[ "${HAS_SYNC_READY}" == "true" ]]; then
            echo "[Ready Checker] ✅ Already has sync-ready label - nothing to do"
            echo "::endgroup::"
            exit 0
          fi

          # Check 3: Must be mergeable (no conflicts)
          if [[ "${MERGEABLE}" != "MERGEABLE" ]]; then
            echo "[Ready Checker] ❌ PR not mergeable (status: ${MERGEABLE}) - waiting for conflict resolution"
            echo "::endgroup::"
            exit 0
          fi

          # Check 4: every required workflow ran and passed. Failures elsewhere cannot be fixed
          # by the CI fixer (it only reacts to required workflows), so they alert instead of blocking
          echo "[Ready Checker] Checking CI status against .github/carto-sync-required-workflows.yml..."

          REQUIRED_JSON=$(yq -o=json '.required' .github/carto-sync-required-workflows.yml)
          CHECKS_JSON=$(gh pr checks ${PR_NUMBER} \
            --repo ${{ github.repository }} \
            --json name,workflow,bucket)

          UNGATED_FAILED=$(jq -r --argjson req "${REQUIRED_JSON}" \
            '[.[] | select(.bucket == "fail" or .bucket == "cancel") | select(.workflow as $w | $req | index($w) | not) | .workflow] | unique | join(", ")' \
            <<< "${CHECKS_JSON}")
          echo "ungated-failed=${UNGATED_FAILED}" >> $GITHUB_OUTPUT
          echo "pr-number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "pr-url=${PR_URL}" >> $GITHUB_OUTPUT
          echo "silent-mode=${HAS_SILENT_SYNC}" >> $GITHUB_OUTPUT
          if [[ -n "${UNGATED_FAILED}" ]]; then
            echo "::warning title=Ungated failures::${UNGATED_FAILED} failed but is not required for sync-ready"
          fi

          MISSING=$(jq -r -n --argjson req "${REQUIRED_JSON}" --argjson checks "${CHECKS_JSON}" \
            '$req - [$checks[].workflow] | join(", ")')
          FAILED=$(jq -r --argjson req "${REQUIRED_JSON}" \
            '[.[] | select(.workflow as $w | $req | index($w)) | select(.bucket == "fail" or .bucket == "cancel") | "\(.workflow) / \(.name)"] | join(", ")' \
            <<< "${CHECKS_JSON}")
          PENDING=$(jq -r --argjson req "${REQUIRED_JSON}" \
            '[.[] | select(.workflow as $w | $req | index($w)) | select(.bucket == "pending") | "\(.workflow) / \(.name)"] | join(", ")' \
            <<< "${CHECKS_JSON}")

          if [[ -n "${FAILED}" ]]; then
            echo "[Ready Checker] ❌ Required checks failed - waiting for CI fixer: ${FAILED}"
            echo "::endgroup::"
            exit 0
          fi

          if [[ -n "${PENDING}" ]]; then
            echo "[Ready Checker] ⏳ Required checks still pending: ${PENDING}"
            echo "::endgroup::"
            exit 0
          fi

          if [[ -n "${MISSING}" ]]; then
            echo "[Ready Checker] ⏳ Required workflows have not run yet: ${MISSING}"
            echo "::endgroup::"
            exit 0
          fi

          # All conditions met! Add the sync-ready label
          echo "[Ready Checker] ✅ All conditions met! Adding sync-ready label..."

          gh pr edit ${PR_NUMBER} \
            --repo ${{ github.repository }} \
            --add-label "sync-ready"

          echo "[Ready Checker] 🎉 Added sync-ready label to PR #${PR_NUMBER}"
          echo "::notice title=PR Ready::${PR_URL} is now ready for merge and n8n notification"

          # Export for Slack notification
          echo "pr-ready=true" >> $GITHUB_OUTPUT
          echo "pr-title=${PR_TITLE}" >> $GITHUB_OUTPUT

          if [[ "${HAS_SILENT_SYNC}" == "true" ]]; then
            echo "[Ready Checker] 🔇 Silent mode enabled - will skip Slack notification"
          fi

          # Extract version from branch
          VERSION=$(echo "${BRANCH}" | sed 's|upstream-sync/||')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          echo "::endgroup::"

      - name: Alert Slack - ungated failures need a human
        if: steps.check-and-label.outputs.ungated-failed != '' && steps.check-and-label.outputs.silent-mode != 'true'
        env:
          GH_TOKEN: ${{ secrets.X_GITHUB_SUPERCARTOFANTE }}
          SLACK_KEY: ${{ secrets.SLACK_KEY }}
          PR_NUMBER: ${{ steps.check-and-label.outputs.pr-number }}
          PR_URL: ${{ steps.check-and-label.outputs.pr-url }}
          UNGATED_FAILED: ${{ steps.check-and-label.outputs.ungated-failed }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          MARKER="CARTO_UNGATED_ALERT:${HEAD_SHA}"
          if gh pr view "${PR_NUMBER}" --repo ${{ github.repository }} --json comments --jq '.comments[].body' | grep -qF "${MARKER}"; then
            echo "[Ready Checker] Already alerted for ${HEAD_SHA}"
            exit 0
          fi

          if [[ -z "${SLACK_KEY}" ]]; then
            echo "::warning::SLACK_KEY not configured - skipping ungated failure alert"
            exit 0
          fi

          jq -n --arg channel "${SLACK_CHANNEL_LITELLM}" --arg url "${PR_URL}" --arg failed "${UNGATED_FAILED}" \
            '{channel: $channel, unfurl_links: false,
              text: ":warning: LiteLLM upstream sync <\($url)|PR> has failing workflows outside the required list: \($failed). The CI fixer does not handle them, so a human needs to disable, fix or accept them"}' \
            > /tmp/ungated_payload.json
          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_KEY}" \
            -H "Content-Type: application/json" \
            -d @/tmp/ungated_payload.json > /dev/null

          gh pr comment "${PR_NUMBER}" --repo ${{ github.repository }} \
            --body "Failing workflows outside \`.github/carto-sync-required-workflows.yml\`: ${UNGATED_FAILED}. They do not block sync-ready and the CI fixer ignores them. <!-- ${MARKER} -->"

      - name: Notify Slack - Tests Passed
        if: steps.check-and-label.outputs.pr-ready == 'true' && steps.check-and-label.outputs.silent-mode != 'true'
        env:
          GH_TOKEN: ${{ secrets.X_GITHUB_SUPERCARTOFANTE }}
          PR_NUMBER: ${{ steps.check-and-label.outputs.pr-number }}
          PR_URL: ${{ steps.check-and-label.outputs.pr-url }}
          VERSION: ${{ steps.check-and-label.outputs.version }}
        run: |
          set -eu

          echo "::group::Finding thread_ts from PR comments"

          # Look for thread_ts stored by initial notification
          THREAD_TS=$(gh pr view ${PR_NUMBER} \
            --repo ${{ github.repository }} \
            --json comments \
            --jq '.comments[].body | select(contains("SLACK_THREAD_TS:")) | capture("SLACK_THREAD_TS:(?<ts>[0-9.]+)") | .ts' \
            | head -1 || echo "")

          if [[ -n "${THREAD_TS}" ]]; then
            echo "[Slack] Found thread_ts: ${THREAD_TS} - will reply in thread with broadcast"
            THREAD_PARAM="\"thread_ts\": \"${THREAD_TS}\", \"reply_broadcast\": true,"
          else
            echo "[Slack] No thread_ts found - will post new message"
            THREAD_PARAM=""
          fi

          echo "::endgroup::"

          echo "::group::Posting Step 4 notification to Slack"

          WORKFLOW_URL="${{ github.event.workflow_run.html_url }}"

          # Clean version for display
          VERSION_CLEAN=$(echo "${VERSION}" | sed -E 's/^v//; s/-stable$//')

          # Progress bar (step 4 of 4 complete)
          PROGRESS="◼️◼️◼️◼️"

          # Build compare URL for upstream changes
          COMPARE_URL="https://github.com/BerriAI/litellm/releases/tag/${VERSION}"

          # Build Block Kit payload with colored sidebar
          cat > /tmp/slack_payload.json << EOF
          {
            "channel": "${SLACK_CHANNEL_LITELLM}",
            ${THREAD_PARAM}
            "unfurl_links": false,
            "unfurl_media": false,
            "attachments": [
              {
                "color": "#1E88E5",
                "fallback": "LiteLLM Upstream Sync: Tests Passed (v${VERSION_CLEAN})",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*:white_check_mark: LiteLLM Upstream Sync*"
                    }
                  },
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": "${PROGRESS}  *Step 4/4: Tests Passed*"
                      }
                    ]
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "All CI checks passed. PR ready for review and merge."
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Version*\n\`v${VERSION_CLEAN}\`"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Status*\n:white_check_mark: Ready to merge"
                      }
                    ]
                  },
                  {
                    "type": "actions",
                    "elements": [
                      {
                        "type": "button",
                        "text": { "type": "plain_text", "text": "Review PR", "emoji": true },
                        "style": "primary",
                        "url": "${PR_URL}"
                      },
                      {
                        "type": "button",
                        "text": { "type": "plain_text", "text": "View Release", "emoji": true },
                        "url": "${COMPARE_URL}"
                      },
                      {
                        "type": "button",
                        "text": { "type": "plain_text", "text": "View Logs", "emoji": true },
                        "url": "${WORKFLOW_URL}"
                      }
                    ]
                  }
                ]
              }
            ]
          }
          EOF

          # Check if SLACK_KEY is configured
          if [[ -z "${{ secrets.SLACK_KEY }}" ]]; then
            echo "::warning::SLACK_KEY not configured - skipping Slack notification"
            echo "::endgroup::"
            exit 0
          fi

          # Send to Slack
          RESPONSE=$(curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ secrets.SLACK_KEY }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/slack_payload.json)

          if echo "$RESPONSE" | jq -e '.ok == true' > /dev/null 2>&1; then
            if [[ -n "${THREAD_TS}" ]]; then
              echo "✅ [Slack] Tests passed notification sent (replied in thread)"
            else
              echo "✅ [Slack] Tests passed notification sent (new message)"
            fi
          else
            ERROR=$(echo "$RESPONSE" | jq -r '.error // "unknown"')
            echo "⚠️ [Slack] Failed to send notification: ${ERROR}"
          fi

          echo "::endgroup::"
