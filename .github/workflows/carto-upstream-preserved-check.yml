name: CARTO Upstream Preserved Check

# The features manifest only proves CARTO code survived a sync. This proves the
# opposite direction: that a conflicted file did not simply keep carto/main's
# copy and silently discard the upstream release's changes to it

on:
  pull_request:
    branches:
      - carto/main

permissions:
  contents: read

jobs:
  upstream-preserved:
    name: Verify upstream changes preserved
    if: startsWith(github.head_ref, 'upstream-sync/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the upstream release tag
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -eu
          TAG="${HEAD_REF#upstream-sync/}"
          git fetch --no-tags https://github.com/BerriAI/litellm.git "refs/tags/${TAG}:refs/tags/${TAG}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Check for upstream changes dropped by the resolution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/check_upstream_preserved.py --upstream "$TAG" --carto "$BASE_SHA" --resolved "$HEAD_SHA"

  script-tests:
    name: Upstream preserved check tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          python -m pip install --quiet pytest==8.4.2
          python -m pytest .github/scripts/test_check_upstream_preserved.py -q -p no:cacheprovider --noconftest
