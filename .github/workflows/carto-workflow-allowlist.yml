name: CARTO Workflow Allowlist

# Upstream syncs keep adding workflows that start enabled and run against upstream infrastructure.
# This disables everything outside .github/carto-enabled-workflows.yml and the carto-* prefix: on the
# sync PR that introduces a new workflow, when it lands on carto/main, and daily as a backstop

on:
  pull_request:
    branches:
      - carto/main
  push:
    branches:
      - carto/main
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carto-workflow-allowlist-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  enforce:
    name: Disable workflows outside the allowlist
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'upstream-sync/')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml==6.0.2

      - name: Disable workflows outside the allowlist
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/enforce_workflow_allowlist.py
